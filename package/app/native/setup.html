<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QQ</title><style>{{SCREEN_CSS}}</style></head><body class="bay"><main class="installer"><header class="appbar"><div class="brand"><img src="{{PENGUIN_URI}}" alt=""><b>QQ</b></div><span>应用安装</span></header><div class="setup-layout"><div class="illustration" aria-hidden="true"><img alt="" src="{{PENGUIN_URI}}"></div><div class="form"><h1>安装 QQ</h1><p class="hint">选择 Linux QQ 的 amd64 安装包。</p><label class="file"><span class="file-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h9l5 5v13H5zM14 3v6h5M9 14h6M9 17h4"/></svg></span><span><b id="filename">选择安装包</b><small>.deb 文件 · 最大 512 MiB</small></span><input id="file" type="file" accept=".deb" aria-label="选择安装包"></label><button class="primary" id="install" disabled>开始安装</button><output class="status" id="status" aria-live="polite"></output></div></div></main><script>const base = '/app/fnos-qq';
const file = document.querySelector('#file');
const nameBox = document.querySelector('#filename');
const button = document.querySelector('#install');
const statusBox = document.querySelector('#status');
let sending = false, serverBusy = false, valid = false;
function updateControls() {
  file.disabled = sending || serverBusy;
  button.disabled = file.disabled || !valid;
}
file.onchange = () => {
  const selected = file.files[0];
  valid = selected && /\.deb$/i.test(selected.name) && selected.size > 0 && selected.size <= 512 * 1024 * 1024;
  nameBox.textContent = selected?.name || '选择安装包';
  statusBox.textContent = selected && !valid ? '请选择 512 MiB 以内的 .deb 文件。' : '';
  updateControls();
};
function transfer(selected) {
  return new Promise((resolve, reject) => {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + base + '/setup-transfer');
    let offset = 0;
    ws.onopen = () => ws.send(JSON.stringify({op:'upload', nonce:'__NONCE__', size:selected.size}));
    ws.onmessage = async event => {
      try {
        const msg = JSON.parse(event.data);
        if (msg.error) throw Error(msg.error);
        if (msg.done) { resolve(); ws.close(); return; }
        if (msg.next) {
          const chunk = selected.slice(offset, offset + 512 * 1024);
          ws.send(await chunk.arrayBuffer());
          offset += chunk.size;
          statusBox.textContent = offset === selected.size ? '正在校验安装包…' : '正在上传 ' + Math.floor(offset / selected.size * 100) + '%';
        }
      } catch (error) { reject(error); ws.close(); }
    };
    ws.onclose = () => reject(Error('连接已中断，请重新安装。'));
    ws.onerror = () => reject(Error('无法连接安装服务，请重试。'));
  });
}
function refreshStatusText(text) { statusBox.textContent = text; }
button.onclick = async () => {
  if (button.disabled) return;
  sending = true; updateControls();
  try {
    await transfer(file.files[0]);
    statusBox.textContent = '安装完成，正在打开 QQ…';
  } catch (error) {
    statusBox.textContent = error.message;
  } finally { sending = false; updateControls(); }
};
async function poll() {
  try {
    const response = await fetch(base + '/setup-status', {cache:'no-store'});
    if (response.status === 404) { location.reload(); return; }
    if (!response.ok) return;
    const state = await response.json();
    serverBusy = state.busy || state.ready;
    updateControls();
    if (!sending && (serverBusy || (!file.files.length && !state.message.startsWith('请选择')))) refreshStatusText(state.message);
  } catch { /* The web service changes while the desktop starts. */ }
}
poll(); setInterval(poll, 1400);
</script></body></html>
