name: Build and release FPK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check package version
        id: manifest
        shell: bash
        run: |
          version=$(awk '$1 == "version" {print $3}' package/manifest)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag must match manifest version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build with fnpack 1.2.3
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --max-time 120 --output fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          echo '54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93  fnpack' | sha256sum -c -
          chmod +x fnpack
          cd "$GITHUB_WORKSPACE"
          python3 scripts/build.py --fnpack "$RUNNER_TEMP/fnpack"
          cd dist
          sha256sum -c *.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fnos-qq-${{ steps.manifest.outputs.version }}-amd64
          path: dist/
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fnos-qq-${{ needs.build.outputs.version }}-amd64
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          sha256sum -c *.sha256
          gh release create "$GITHUB_REF_NAME" *.fpk *.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "QQ $GITHUB_REF_NAME" \
            --notes "适用于 x86-64 飞牛 NAS。手动安装 FPK 后，在 QQ 中选择腾讯 Linux QQ 的 amd64 .deb。"
